services:
  - type: web
    name: vivek-qa-portfolio
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput && python manage.py seed_knowledgebase"
    startCommand: "gunicorn config.wsgi"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: TIME_ZONE
        value: "Asia/Kolkata"
      - key: CONTACT_RECEIVER_EMAIL
        value: "vivkverma905@gmail.com"
      # Resend sends over HTTPS, not a raw SMTP socket -- Render's free tier
      # appears to block outbound SMTP entirely, so this is the path that
      # actually works here. See core/views.py _send_via_resend.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "onboarding@resend.dev"
      # SMTP settings kept as a fallback path (used only if RESEND_API_KEY is
      # unset) -- not relied on for delivery on this host.
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "vivkverma905@gmail.com"
